<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Battle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <div class="topbar">
      <div class="title">Ngọc Rồng Offline</div>
      <div class="level" id="levelBadge">Cấp 1</div>
    </div>

    <div class="character-picker" id="characterPicker"></div>

    <div class="battle-scene">
      <div class="fighter-block player">
        <div class="fighter-top">
          <span id="playerName">-</span>
          <span class="tag" id="playerType">-</span>
        </div>

        <div class="avatar-area">
          <div id="playerAvatar" class="avatar player-avatar">🦸</div>
        </div>

        <div class="bars">
          <div class="bar-label">
            <span>HP</span>
            <span id="playerHpText">0 / 0</span>
          </div>
          <div class="bar">
            <div id="playerHpBar" class="fill hp"></div>
          </div>
        </div>

        <div class="bars">
          <div class="bar-label">
            <span>Ki</span>
            <span id="playerKiText">0 / 0</span>
          </div>
          <div class="bar">
            <div id="playerKiBar" class="fill ki"></div>
          </div>
        </div>

        <div class="action-row">
          <button class="attack" onclick="doAction('attack')">Đánh thường</button>
          <button class="special" onclick="doAction('special')">Kỹ năng</button>
          <button class="heal" onclick="doAction('heal')">Hồi phục</button>
        </div>
      </div>

      <div class="fighter-block enemy">
        <div class="fighter-top">
          <span id="enemyName">-</span>
          <span class="tag enemy-tag" id="enemyType">-</span>
        </div>

        <div class="avatar-area">
          <div id="enemyAvatar" class="avatar enemy-avatar">👹</div>
        </div>

        <div class="bars">
          <div class="bar-label">
            <span>HP</span>
            <span id="enemyHpText">0 / 0</span>
          </div>
          <div class="bar">
            <div id="enemyHpBar" class="fill hp"></div>
          </div>
        </div>

        <div class="bars">
          <div class="bar-label">
            <span>Ki</span>
            <span id="enemyKiText">0 / 0</span>
          </div>
          <div class="bar">
            <div id="enemyKiBar" class="fill ki"></div>
          </div>
        </div>

        <div class="action-row">
          <button class="restart" onclick="restartGame()">Chơi lại</button>
        </div>
      </div>
    </div>

    <div id="battleLog" class="battle-log">
      Chọn nhân vật để bắt đầu trận đấu.
    </div>
  </div>

  <audio id="attackSound" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA..."></audio>
  <script src="script.js"></script>
</body>
</html>
